# Netlify: static build of the game. Node version comes from .nvmrc.
# Tests run first, so a failing test stops the deploy and the live site stays as it was.
# The game uses hash routes (#/map, #/level/...), so no redirect rules are needed.
[build]
  command = "npm test && npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
