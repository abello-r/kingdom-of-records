# Netlify: static build of the game. Node version comes from .nvmrc.
# The game uses hash routes (#/map, #/level/...), so no redirect rules are needed.
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
